version: "3.9"

services:
  # ---------------------- #
  # 1. MySQL for Auth Service
  # ---------------------- #
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: auth_db
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authpass
    ports:
      - "3307:3306"
    volumes:
      - auth-data:/var/lib/mysql

  # ---------------------- #
  # 2. Auth Service
  # ---------------------- #
  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    env_file: ./auth-service/.env
    depends_on:
      - auth-db
    ports:
      - "8081:8081"
    environment:
      DB_HOST: auth-db
      DB_PORT: 3306
      DB_USER: authuser
      DB_PASSWORD: authpass
      DB_NAME: auth_db

  # ---------------------- #
  # 3. Postgres for Kong
  # ---------------------- #
  kong-database:
    image: postgres:9.6
    container_name: kong-database
    restart: always
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    ports:
      - "5432:5432"
    volumes:
      - db-data-kong-postgres:/var/lib/postgresql/data

  # ---------------------- #
  # 4. Kong Migrations (init DB)
  # ---------------------- #
  kong-migrations:
    image: kong:3.3
    container_name: kong-migrations
    restart: on-failure
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    command: kong migrations bootstrap

  # ---------------------- #
  # 5. Kong API Gateway
  # ---------------------- #
  kong:
    image: kong:3.3
    container_name: kong
    restart: always
    depends_on:
      - kong-database
      - kong-migrations
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"

  # ---------------------- #
  # 6. Konga (UI)
  # ---------------------- #
  konga:
    image: pantsel/konga
    container_name: konga
    restart: always
    depends_on:
      - kong
    environment:
      NODE_ENV: production
    ports:
      - "1337:1337"

volumes:
  auth-data:
  db-data-kong-postgres:
