services:
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"  # host port 3307 -> container 3306
    volumes:
      - auth-data:/var/lib/mysql
    networks:
      - backend
      
  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    env_file: ./auth-service/.env
    depends_on:
      - auth-db
    ports:
      - "8081:8081"
    networks:
      - backend

      
  course-db:
    image: mysql:8
    container_name: course-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: course_db
    ports:
      - "3308:3306"  # host port 3307 -> container 3306
    volumes:
      - course-data:/var/lib/mysql
    networks:
      - backend


  course-service:
    build: ./course-service
    ports:
      - "8082:8082"
    env_file:
      - ./course-service/.env
    depends_on:
      - course-db
    networks:
      - backend


  kong:
    image: kong:3.3
    container_name: kong
    restart: always
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml  # บอก kong ใช้ไฟล์นี้
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong.yml:/etc/kong/kong.yml  # mount kong.yml เข้า container
    ports:
      - "8000:8000" # proxy
      - "8001:8001" # admin
    networks:
      - backend


volumes:
  auth-data:
  course-data:

networks:
  backend: