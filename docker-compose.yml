version: "3.9"

services:
  # ----------------- MySQL Database -----------------
  db:
    image: mysql:8.0
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: authdb
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - dogcourse-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      retries: 10

  # ----------------- Auth Service -----------------
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    env_file:
      - ./auth-service/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dogcourse-network

  # ----------------- Booking DB -----------------
  booking-db:
    image: mysql:8.0
    container_name: booking-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: bookingdb
      MYSQL_USER: bookinguser
      MYSQL_PASSWORD: bookingpass
    ports:
      - "3308:3306"
    volumes:
      - booking_db_data:/var/lib/mysql
    networks:
      - dogcourse-network

  booking-service:
    build: ./booking-service
    container_name: booking_service
    restart: always
    depends_on:
      - auth-service
      - booking-db
    env_file:
      - ./booking-service/.env
    ports:
      - "8082:8082"
    networks:
      - dogcourse-network

  # ----------------- Kong Database -----------------
  kong-db:
    image: postgres:15
    container_name: kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    ports:
      - "5432:5432"
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - dogcourse-network

  # ----------------- Kong -----------------
  kong:
    image: kong:3.6
    container_name: kong
    restart: unless-stopped
    ports:
      - "8000:8000"  # Proxy
      - "8443:8443"  # Proxy HTTPS
      - "8001:8001"  # Admin API
      - "8444:8444"  # Admin API HTTPS
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    depends_on:
      - kong-db
    networks:
      - dogcourse-network
    volumes:
    - ./kong.yml:/usr/local/kong/declarative/kong.yml
# ----------------- Volumes -----------------
volumes:
  db_data:
  booking_db_data:
  kong_data:

# ----------------- Networks -----------------
networks:
  dogcourse-network:
    external: true
