_format_version: "2.1"

services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: true

  - name: course-service
    url: http://course-service:8082
    routes:
      - name: course-route
        paths:
          - /courses
        strip_path: false   


  - name: dog-service
    url: http://dog-service:8083
    routes:
      - name: dog-route
        paths:
          - /dogs
        strip_path: false

  - name: booking-service
    url: http://booking-service:8084
    routes:
      - name: booking-route
        paths:
          - /courses/booking
        strip_path: false


  - name: review-service
    url: http://review-service:8085
    routes:
      - name: review-route
        paths:
          - /courses/review
        strip_path: false