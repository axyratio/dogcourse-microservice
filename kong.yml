_format_version: "2.1"

services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-route
        paths:
          - /auth

  - name: course-service
    url: http://course-service:8082
    routes:
      - name: course-route
        paths:
          - /courses
        strip_path: false