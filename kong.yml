_format_version: "2.1"

services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: true

  - name: course-service
    url: http://course-service:8082
    routes:
      - name: course-route
        paths:
          - /courses
        strip_path: false   


  - name: dog-service
    url: http://dog-service:8083
    routes:
      - name: dog-route
        paths:
          - /dogs
        strip_path: false